name: Publish documentation to GitHub Pages
on:
  push:
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      publish: ${{ steps.select.outputs.publish }}
      notebooks: ${{ steps.select.outputs.notebooks }}
    steps:
      - name: initialize
        run: |
          echo "FEWPAGE_BUILD=false" >> "$GITHUB_ENV"
          echo "FEWPAGE_PUBLISH=false" >> "$GITHUB_ENV"
          echo "FEWPAGE_NOTEBOOK=false" >> "$GITHUB_ENV"
      - name: build on commit message
        if: contains(github.event.head_commit.message, '[ci:build-pages]')
        run: |
          echo "FEWPAGE_BUILD=true" >> "$GITHUB_ENV"
      - name: build on commit message
        if: contains(github.event.head_commit.message, '[ci:publish-pages]')
        run: |
          echo "FEWPAGE_BUILD=true" >> "$GITHUB_ENV"
          echo "FEWPAGE_PUBLISH=true" >> "$GITHUB_ENV"
      - name: execute notebooks on request
        if: contains(github.event.head_commit.message, '[doc:run-notebooks]')
        run: |
          echo "FEWPAGE_NOTEBOOK=true" >> "$GITHUB_ENV"
      - name: build and publish on tag 'v*'
        if: startsWith(github.event.ref, 'refs/tags/v')
        run: |
          echo "FEWPAGE_BUILD=true" >> "$GITHUB_ENV"
          echo "FEWPAGE_PUBLISH=true" >> "$GITHUB_ENV"
          echo "FEWPAGE_NOTEBOOK=true" >> "$GITHUB_ENV"
      - name: output results
        id: select
        run: |
          echo "build=$FEWPAGE_BUILD" >> $GITHUB_OUTPUT
          echo "publish=$FEWPAGE_PUBLISH" >> $GITHUB_OUTPUT
          echo "notebooks=$FEWPAGE_NOTEBOOK" >> $GITHUB_OUTPUT
  build_doc:
    name: Build documentation
    runs-on: "ubuntu-24.04"
    needs:
      - select
    if: needs.select.outputs.build == 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@d9e0f98d3fc6adb07d1e3d37f3043649ddad06a1 # v6.5.0
        with:
          python-version: '3.12'
      - name: Install pandoc
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
        with:
          apt: liblapacke-dev pandoc
      - name: Install bare package
        run: |
          uv sync --extra doc --extra testing \
            -C cmake.define.FEW_WITH_GPU=OFF \
            -C cmake.define.FEW_LAPACKE_FETCH=OFF \
            -C cmake.define.FEW_LAPACKE_DETECT_WITH=PKGCONFIG
      - name: Restore the cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: restore_cache
        with:
          path: local_cache
          key: ${{ hashFiles('src/few/files/registry.yml') }}
      - name: Export configuration options to force using prefetched cache of files
        if: steps.restore_cache.outputs.cache-hit == 'true'
        run: |
          echo "FEW_FILE_ALLOW_DOWNLOAD=no" >> "$GITHUB_ENV"
          echo "FEW_FILE_EXTRA_PATHS=$(pwd)/local_cache" >> "$GITHUB_ENV"
      - name: Check external links are working
        run: |
          uv run sphinx-build -M linkcheck docs/source docs/build_checklinks \
              --define nbsphinx_execute=never
      - name: Run notebook examples
        if: needs.select.outputs.notebooks == 'true'
        run: |
          uv run jupyter nbconvert --execute --clear-output examples/Trajectory_tutorial.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/Amplitude_tutorial.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/modeselect.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/modesummation.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/cubicspline.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/swsh.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/utility.ipynb
          uv run jupyter nbconvert --execute --clear-output examples/waveform.ipynb
      - name: Build documentation
        run: |
          uv run sphinx-build -M html docs/source docs/build \
              --define nbsphinx_execute=never
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/build/html
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build_doc
      - select
    if: needs.select.outputs.publish == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
